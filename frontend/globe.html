<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#09163b;color:#fff;font-family:Arial,sans-serif}
.map{position:relative;width:100%;height:100%;overflow:hidden;background:#09163b;touch-action:none}
.map:fullscreen{padding:25px}.world{width:100%;height:100%;display:block;cursor:grab;user-select:none}.world:active{cursor:grabbing}
.controls{position:absolute;right:6px;bottom:22px;display:grid;gap:8px}
button{display:grid;place-items:center;border:0;border-radius:5px;width:45px;height:45px;background:#d9d9dc;color:#080808;cursor:pointer;font-size:31px;font-weight:700}
button:hover{background:white}button:focus-visible{outline:3px solid #50c1d9;outline-offset:2px}button:disabled{background:#626266;color:#414145;cursor:default}
button svg{width:24px;height:24px}.coordinates{position:absolute;bottom:0;left:-1px;margin:0;padding:12px 10px;background:#030a19;font-size:14px;font-weight:600}
.pin{filter:drop-shadow(0 4px 3px #0004)}.pin title{font-family:Arial,sans-serif}
@media(max-width:600px){button{width:36px;height:36px}.coordinates{font-size:12px;padding:10px}.controls{bottom:19px}}
</style>
</head>
<body>
<div class="map" id="map">
<svg class="world" id="world" viewBox="0 0 880 880" preserveAspectRatio="xMidYMin meet" role="img" aria-label="Illustrated globe with the selected location" tabindex="0">
<defs>
  <radialGradient id="ocean" cx="35%" cy="32%" r="80%"><stop stop-color="#5ac1d0"/><stop offset="1" stop-color="#68bdca"/></radialGradient>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0f4e9"/><stop offset="1" stop-color="#cfede2"/></linearGradient>
  <clipPath id="sphere"><circle cx="440" cy="440" r="400"/></clipPath>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
</defs>
<g id="scene">
  <g clip-path="url(#sphere)">
    <circle cx="440" cy="440" r="400" fill="url(#ocean)"/>
    <g fill="url(#land)">
      <path d="M84 190C121 147 167 108 211 91C238 103 266 83 293 79C319 75 333 87 348 99C365 113 390 96 414 105C443 118 413 138 403 146C384 167 395 184 414 197C435 211 417 226 398 221C379 216 372 194 361 201C350 207 360 233 337 234C317 234 304 239 320 251C339 264 368 242 383 253C409 273 371 276 361 292C352 306 357 322 344 334C333 344 335 355 340 370C343 385 333 381 323 359C310 329 273 327 258 344C240 365 260 389 284 401C303 410 317 404 329 420C344 440 354 429 367 425L389 405C403 394 416 402 426 407L454 416C481 425 492 444 502 456C517 472 536 473 551 476C575 479 598 491 599 507C600 528 580 546 573 566C563 593 542 605 530 626C513 649 503 662 497 685C488 712 465 731 464 755C463 774 484 783 471 786C451 787 438 762 432 743C423 715 421 683 414 655C407 626 400 604 395 581C390 554 367 544 351 521C333 492 335 463 347 442C327 435 317 426 305 423C267 412 246 392 229 368C216 351 204 336 199 318C194 302 186 297 187 311C189 331 202 349 191 352C177 347 166 324 165 307C163 283 149 269 134 252C112 228 97 214 84 190Z"/>
      <path d="M473 72C494 60 521 65 546 78C563 88 578 102 568 118C556 136 548 140 540 161C534 179 522 196 510 200C497 207 492 188 490 173C486 146 472 128 471 111C469 96 467 80 473 72Z"/>
      <path d="M742 353C756 343 786 357 808 367L851 393L873 448L864 612L803 694C790 672 796 639 785 613C777 592 784 577 769 557C755 539 745 532 727 525C707 517 695 508 695 488C694 463 710 446 719 427C729 407 742 403 762 395C783 385 775 367 742 353Z"/>
      <path d="M737 194C764 168 798 174 829 195L857 253L837 310C821 324 809 318 798 302C781 278 768 269 751 259C734 249 718 227 737 194Z"/>
      <path d="M337 349C350 345 365 351 379 356C398 363 398 370 384 371C365 369 350 359 336 363Z"/>
      <ellipse cx="412" cy="383" rx="18" ry="6" transform="rotate(12 412 383)"/>
      <ellipse cx="451" cy="395" rx="9" ry="5" transform="rotate(20 451 395)"/>
    </g>
    <circle cx="440" cy="440" r="400" fill="transparent" filter="url(#grain)" pointer-events="none"/>
  </g>
  <g id="marker" class="pin">
    <title id="pin-title"></title>
    <path d="m-27 8 30 12 24-17-31-11z" fill="#15244b"/>
    <path d="M0 14C-4 4-9-5-20-15a30 30 0 1 1 40 0C9-5 4 4 0 14Z" fill="#e72208"/>
    <path d="M0-51c-3 6-16 16-16 27 0 9 6 13 12 14-4-7 1-12 4-17 2 4 7 8 5 17 7-2 12-7 12-14 0-7-4-11-7-15l-4 6C5-42 3-47 0-51Z" fill="white"/>
  </g>
</g>
</svg>
<div class="controls" aria-label="Map controls">
  <button id="fullscreen" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
  <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zoom-out" title="Zoom out" aria-label="Zoom out" disabled>−</button>
</div>
<p id="coordinates" class="coordinates"></p>
</div>
<script>
const selected = __LOCATION_DATA__;
const map = document.getElementById('map'), world = document.getElementById('world'), scene = document.getElementById('scene');
const radians = Math.PI / 180;
// Projeção ortográfica para posicionar o marcador na ilustração das Américas.
const latitude = selected.latitude * radians, longitude = (selected.longitude + 65) * radians;
const x = 440 + 400 * Math.cos(latitude) * Math.sin(longitude), y = 440 - 400 * Math.sin(latitude);
const marker = document.getElementById('marker');
marker.setAttribute('transform', `translate(${x} ${y})`);
marker.style.display = Math.cos(latitude) * Math.cos(longitude) >= 0 ? '' : 'none';
document.getElementById('pin-title').textContent = selected.location + ' · Demonstration hotspot';
document.getElementById('coordinates').textContent = `Lat.: ${selected.latitude.toFixed(2)} / Long.: ${selected.longitude.toFixed(2)}`;
let zoom = 1, dx = 0, dy = 0, drag = null;
const zoomIn = document.getElementById('zoom-in'), zoomOut = document.getElementById('zoom-out');
function update() {
  scene.setAttribute('transform', `translate(${440 + dx} ${440 + dy}) scale(${zoom}) translate(-440 -440)`);
  zoomIn.disabled = zoom >= 2.5; zoomOut.disabled = zoom <= 1;
}
function changeZoom(delta) { zoom = Math.min(2.5, Math.max(1, zoom + delta)); if (zoom === 1) { dx = 0; dy = 0; } update(); }
zoomIn.onclick = () => changeZoom(.25); zoomOut.onclick = () => changeZoom(-.25);
world.addEventListener('pointerdown', e => { drag = {x:e.clientX,y:e.clientY,dx,dy}; world.setPointerCapture(e.pointerId); });
world.addEventListener('pointermove', e => { if (!drag) return; const scale = 880 / world.getBoundingClientRect().width; dx = Math.max(-300,Math.min(300,drag.dx+(e.clientX-drag.x)*scale)); dy = Math.max(-300,Math.min(300,drag.dy+(e.clientY-drag.y)*scale)); update(); });
world.addEventListener('pointerup', () => drag = null);
world.addEventListener('pointercancel', () => drag = null);
world.addEventListener('dblclick', () => {zoom=1;dx=0;dy=0;update();});
world.addEventListener('keydown', e => { if (e.key==='+' || e.key==='=') changeZoom(.25); else if(e.key==='-') changeZoom(-.25); else if(e.key==='0'){zoom=1;dx=0;dy=0;update();} });
const fullscreenButton = document.getElementById('fullscreen');
let frameStyle = null;
function restoreFrame() {
  if (frameStyle === null) return;
  window.frameElement.style.cssText = frameStyle;
  frameStyle = null;
  fullscreenButton.title = fullscreenButton.ariaLabel = 'Full screen';
}
function expandFrame() {
  // Alternativa em navegadores que bloqueiam a API nativa de tela cheia.
  const frame = window.frameElement;
  if (!frame) return;
  frameStyle = frame.style.cssText;
  for (const [property, value] of Object.entries({position:'fixed',inset:'0',width:'100vw',height:'100dvh','z-index':'2147483647',background:'#09163b'})) {
    frame.style.setProperty(property, value, 'important');
  }
  fullscreenButton.title = fullscreenButton.ariaLabel = 'Exit full screen';
}
fullscreenButton.onclick = async () => {
  if (frameStyle !== null) { restoreFrame(); return; }
  try { if(document.fullscreenElement) await document.exitFullscreen(); else await map.requestFullscreen(); }
  catch { expandFrame(); }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') restoreFrame(); });
</script>
</body>
</html>
