<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="globe.css">
<script src="vendor/globe.gl.min.js"></script>
</head>
<body>
<main id="map" aria-label="Interactive 3D location filter">
  <div id="globe" tabindex="0" aria-label="Drag to rotate the globe. Click a country to filter."></div>
  <div id="loading" role="status">Loading globe…</div>
  <p class="hint">Drag to rotate · Click a country</p>
  <aside class="hotspot-legend" aria-label="Satellite sensor legend">
    <div class="sensor-legend-items">
      <span><i class="sensor-swatch sensor-swatch--modis" aria-hidden="true"></i>MODIS</span>
      <span><i class="sensor-swatch sensor-swatch--viirs" aria-hidden="true"></i>VIIRS</span>
    </div>
    <p id="hotspot-status" role="status" aria-live="polite"></p>
  </aside>
  <div class="controls" aria-label="Globe controls">
    <button id="reset" title="Return to selected location" aria-label="Return to selected location"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg></button>
    <button id="fullscreen" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    <button id="zoom-in" title="Zoom in" aria-label="Zoom in"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
    <button id="zoom-out" title="Zoom out" aria-label="Zoom out"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  </div>
  <p id="coordinates" class="coordinates"></p>
</main>
<script src="globe.js"></script>
</body>
</html>
